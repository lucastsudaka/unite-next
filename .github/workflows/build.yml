---
name: Native checks and package

on:
  push:
    branches: [master]
    paths:
      - unite-next@lucastsudaka.github.io/**
      - translations/**
      - unite-next.pot
      - tools/**
      - tests/**
      - .github/**
      - .editorconfig
      - .gitignore
      - README.md
      - CHANGELOG.md
      - LICENSE
      - NOTICE
      - docs/**
      - logo.svg
      - screenshot.png
      - settings.png
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - fedora: 44
            image: registry.fedoraproject.org/fedora@sha256:278ccc1c8af3d618b64accbba691bb14f82d371b2e13c86fa2ac7a447d1e03bb
          - fedora: 45
            image: registry.fedoraproject.org/fedora@sha256:fd95193f58614b1414c21a90a03d2561a9c54caf14f5481d83b52fbfa784efb4
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install native build tools
        run: dnf install --assumeyes --setopt=install_weak_deps=False git gnome-shell gjs gettext glib2 python3 dbus-daemon

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Record native tool versions
        run: |
          gnome-shell --version
          gjs --version
          xgettext --version
          python3 --version

      - name: Validate current sources and translation parity
        run: /usr/bin/python3 tools/build.py check

      - name: Exercise native package and failure scenarios
        run: |
          mkdir -p /tmp/.X11-unix
          /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Exercise runtime contract scenarios in private state
        run: /usr/bin/python3 tools/test-runtime.py

      - name: Build and validate archive
        run: /usr/bin/python3 tools/build.py package

      - name: Prepare the exact artifact for isolated desktop acceptance
        if: ${{ matrix.fedora == 44 && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          sys.path.insert(0, "tools")
          import build

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          if (os.environ["GITHUB_REPOSITORY"] != "lucastsudaka/unite-next" or
                  event["repository"].get("private") is not True):
              raise ValueError("Acceptance artifacts belong only to the selected private repository")
          metadata = build.identity()
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if commit != os.environ["GITHUB_SHA"]:
              raise ValueError("Checkout does not match the workflow commit")
          if (metadata["uuid"] != "unite-next@lucastsudaka.github.io" or
                  metadata["url"] != "https://github.com/" + os.environ["GITHUB_REPOSITORY"]):
              raise ValueError("Candidate must belong to this independent repository")
          filename = f"unite-next-v{metadata['version']}.zip"
          archive = Path("build") / filename
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          candidate = Path("build/candidate")
          candidate.mkdir()
          shutil.copyfile(archive, candidate / filename)
          (candidate / (filename + ".sha256")).write_text(
              f"{digest}  {filename}\n", encoding="utf-8")
          manifest = {"repository": os.environ["GITHUB_REPOSITORY"],
                      "source_commit": commit, "uuid": metadata["uuid"],
                      "version": metadata["version"], "archive": filename, "sha256": digest}
          (candidate / "candidate.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(f"Native acceptance candidate: {filename}; SHA-256: {digest}; source: {commit}")
          PY

      # Transfer is immutable; the release workflow publishes these accepted bytes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.fedora == 44 && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          name: unite-next-native-candidate
          path: build/candidate/*
          if-no-files-found: error
          overwrite: false
          compression-level: 0
